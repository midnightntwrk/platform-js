name: Bug report
description: Report a bug or incorrect behaviour in platform-js
title: "[Bug] "
type: Bug
labels:
  - status:untriaged
  - component:platform-js
body:
  - type: input
    id: version
    attributes:
      label: Version affected
      description: Package version, tag, or commit SHA where the bug occurs.
      placeholder: e.g. @midnight-ntwrk/platform-js@3.0.0 / commit abc1234
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context & setup
      description: Your environment and setup (Node.js version, OS, package manager, bundler).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
      description: If not reproducible, describe the steps as best you recall.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: The (reproducible) outcome. Include errors, logs, or screenshots if relevant.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
