name: CD

# Releases to npm from `main`; how the modes, release PR and canaries work is in DEV_GUIDE.md → Releasing.
# On pull requests only `dry-run` runs, to rehearse a canary publish without uploading anything.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  # Opens or updates the release PR and picks this push's mode: `stable`, `canary` or `none`.
  version:
    name: Version (release PR)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    concurrency:
      group: version-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache: 'yarn'` here: setup-node would call the runner's Yarn 1 before corepack is enabled, and Yarn 1
      # refuses to run under `packageManager: yarn@4`. The Yarn cache is restored below instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      # `.yarnrc.yml` sets `enableGlobalCache: false`, so Yarn keeps its cache in the project.
      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      # Before the signing key is loaded, so dependency install scripts never run with it.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MIDNIGHTCI_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure git signing
        env:
          SIGNING_KEY: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          git config user.name "MidnightCI"
          git config user.email "midnight-automation+midnightci@iohk.io"
          git config user.signingkey "$SIGNING_KEY"
          git config commit.gpgsign true
          git config tag.gpgSign true

      # Must run before the Changesets action consumes the changesets. Empty changesets add no `releases`, so a
      # non-empty list means a real change to snapshot.
      - name: Detect package-bumping changesets
        id: releases
        run: |
          set -uo pipefail   # no -e: a failing `changeset status` is reported below, then counts as no releases
          rm -f changeset-status.json
          if ! yarn changeset status --output=changeset-status.json; then
            echo "::warning::changeset status failed, so this push publishes no canary"
          fi
          if [ -f changeset-status.json ]; then
            COUNT=$(node -p "require('./changeset-status.json').releases.length" 2>/dev/null || echo 0)
          else
            COUNT=0
          fi
          rm -f changeset-status.json
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "hasReleases=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasReleases=false" >> "$GITHUB_OUTPUT"
          fi

      # A bot token, not GITHUB_TOKEN, so pushes to the release PR trigger CI.
      - name: Create or update the release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: 'chore: release'
          commit: 'chore: release'
          version: yarn changeset version
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      # With no changesets left, only a package version missing from npm (the merged release PR's) means `stable`;
      # otherwise the push changed no package and there is nothing to approve.
      - name: Detect an unpublished version
        id: unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          FOUND=false
          for MANIFEST in packages/*/package.json; do
            SPEC=$(node -p "const p = require('./$MANIFEST'); p.private ? '' : p.name + '@' + p.version")
            if [ -n "$SPEC" ] && [ -z "$(npm view "$SPEC" version 2>/dev/null || true)" ]; then
              echo "Not on npm yet: $SPEC"
              FOUND=true
            fi
          done
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"

      - name: Resolve publish mode
        id: mode
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          HAS_RELEASES: ${{ steps.releases.outputs.hasReleases }}
          HAS_UNPUBLISHED: ${{ steps.unpublished.outputs.found }}
        run: |
          set -euo pipefail
          if [ "$HAS_CHANGESETS" = "false" ] && [ "$HAS_UNPUBLISHED" = "true" ]; then
            MODE=stable
          elif [ "$HAS_RELEASES" = "true" ]; then
            MODE=canary
          else
            MODE=none
          fi
          echo "Resolved publish mode: ${MODE}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

  # Publishes under `latest`, pushes the release tag and creates the GitHub Release. Its environment requires reviewers.
  publish-stable:
    name: Publish (stable)
    needs: [version]
    if: needs.version.outputs.mode == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish-stable
    permissions:
      contents: write # push the release tag
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    concurrency:
      group: publish-stable-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }} # authenticates the release-tag push

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          scope: '@midnightntwrk'

      - name: Enable corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      # Before the signing key is loaded, so dependency install scripts never run with it.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MIDNIGHTCI_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure git signing
        env:
          SIGNING_KEY: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          git config user.name "MidnightCI"
          git config user.email "midnight-automation+midnightci@iohk.io"
          git config user.signingkey "$SIGNING_KEY"
          git config commit.gpgsign true
          git config tag.gpgSign true

      - name: Build
        run: yarn dist:publish

      # `changeset publish` runs `npm publish` with OIDC (no token) and provenance; the action then pushes the tag and
      # creates the GitHub Release from the changelog.
      - name: Publish and create the GitHub Release
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: yarn changeset publish
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          NPM_CONFIG_PROVENANCE: 'true'

  # Publishes a snapshot under `canary`, never `latest`. Its environment has no reviewers and only scopes npm's OIDC.
  publish-canary:
    name: Publish (canary)
    needs: [version]
    if: needs.version.outputs.mode == 'canary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish-canary
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    concurrency:
      group: publish-canary-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          scope: '@midnightntwrk'

      - name: Enable corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Snapshot version and publish the canary
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: scripts/publish-canary.sh

  # The canary publish with npm's dry run, then the snapshot packed, installed into an empty project and imported.
  dry-run:
    name: Publish (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-dry-run-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # Without a pending changeset there is no snapshot, and the rehearsal would test the current version instead.
      - name: Add a throwaway patch changeset
        run: |
          printf -- "---\n'@midnightntwrk/platform-js': patch\n---\n\nDry-run snapshot.\n" > .changeset/zzz-dry-run.md

      - name: Snapshot version and publish the canary (dry run)
        env:
          npm_config_dry_run: 'true'
        run: scripts/publish-canary.sh

      - name: Pack the snapshot
        run: yarn package

      - name: Install the tarball and import every entry point
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          TARBALLS=("$PWD"/packages/platform-js/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected one tarball, found ${#TARBALLS[@]}"; exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          case "$TARBALL" in
            *-canary.*) ;;
            *) echo "::error::Expected a canary snapshot, got $(basename "$TARBALL")"; exit 1 ;;
          esac
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund "$TARBALL"
          node --input-type=module -e "
            await import('@midnightntwrk/platform-js');
            await import('@midnightntwrk/platform-js/effect');
            await import('@midnightntwrk/platform-js/effect/Hex');
          "
          echo "Installed and imported $(basename "$TARBALL")"
