name: Check for Changeset

on:
  pull_request:
    branches: [main]

concurrency:
  # One group per pull request (by number), so a newer push replaces the running check, and two PRs whose branches
  # share a name (from forks) never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-changeset:
    name: Check for Changeset
    # Skip release PRs and bot dependency-update PRs: Renovate and Dependabot never author changesets, so the check
    # would always fail on their PRs.
    if: >-
      ${{ !startsWith(github.head_ref, 'changeset-release/') &&
          !startsWith(github.head_ref, 'renovate/') &&
          !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    # The same bound as the CI jobs: a hung install must not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Full history: `changeset status --since` diffs against the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No `cache: 'yarn'` here: setup-node would call the runner's Yarn 1 before corepack is enabled, and Yarn 1
      # refuses to run under `packageManager: yarn@4`. The Yarn cache is restored below instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack
        run: corepack enable

      # `.yarnrc.yml` sets `enableGlobalCache: false`, so Yarn keeps its cache in the project.
      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Check tool versions
        run: |
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify that a changeset exists
        env:
          BASE_REF: ${{ github.base_ref }}
        run: yarn changeset status --since="origin/$BASE_REF" --verbose
